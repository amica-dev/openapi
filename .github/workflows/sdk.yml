name: sdk

# Genera gli SDK pubblici dalla specifica OpenAPI e li pubblica, uno per linguaggio,
# nei rispettivi repository. Si attiva quando arriva un nuovo spec taggato (il tag v* viene
# creato qui dal workflow openapi.yml di Amica20.WebApi.CustomerService) oppure manualmente.
#
# Richiede il secret SDK_PUSH_TOKEN: un PAT con permesso di push sui repo amica-dev/<lang>-sdk.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Verifica che il tag esista su https://hub.docker.com/r/openapitools/openapi-generator-cli/tags
  OPENAPI_GENERATOR_VERSION: v7.11.0

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: csharp
            generator: csharp
            repo: amica-dev/csharp-sdk
            versionProp: packageVersion
            props: "packageName=Amica.Sdk,targetFramework=net8.0,nullableReferenceTypes=true,licenseId=MIT"
          - lang: python
            generator: python
            repo: amica-dev/python-sdk
            versionProp: packageVersion
            props: "packageName=amica_python_sdk,projectName=amica-python-sdk"
          - lang: typescript
            generator: typescript-fetch
            repo: amica-dev/typescript-sdk
            versionProp: npmVersion
            props: "npmName=@amica/typescript-sdk,supportsES6=true,licenseName=MIT"
          - lang: php
            generator: php
            repo: amica-dev/php-sdk
            versionProp: artifactVersion
            props: "invokerPackage=Amica\\Sdk,composerPackageName=amica/php-sdk,licenseName=MIT"
    steps:
      - name: Checkout spec repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pulisci lo spec per gli SDK
        run: python scripts/clean_openapi_for_sdk.py openapi.json openapi-sdk.json

      - name: Genera SDK (${{ matrix.lang }})
        env:
          GENERATOR: ${{ matrix.generator }}
          PROPS: ${{ matrix.props }}
          TARGET_REPO: ${{ matrix.repo }}
          VERSION_PROP: ${{ matrix.versionProp }}
        run: |
          # Versione del pacchetto: derivata dal tag di release (v3.0.0-beta3 -> 3.0.0-beta3);
          # per i dispatch manuali su branch usiamo un placeholder di sviluppo.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          PROPS="${PROPS},${VERSION_PROP}=${VERSION}"
          # gitUserId/gitRepoId vanno passati come flag dedicati (non additional-properties):
          # popolano i repository URL nei metadati dei pacchetti (C#/Python/TypeScript).
          # Per PHP li omettiamo: sovrascriverebbero composerPackageName (amica/php-sdk ->
          # amica-dev/php-sdk) senza in cambio popolare homepage/source.
          GIT_FLAGS=()
          if [ "${{ matrix.lang }}" != "php" ]; then
            GIT_FLAGS=(--git-user-id "${TARGET_REPO%%/*}" --git-repo-id "${TARGET_REPO##*/}")
          fi
          docker run --rm -v "${PWD}:/local" \
            "openapitools/openapi-generator-cli:${OPENAPI_GENERATOR_VERSION}" generate \
            -i /local/openapi-sdk.json \
            -g "$GENERATOR" \
            -t "/local/templates/openapi-generator/${{ matrix.lang }}" \
            -o /local/generated \
            "${GIT_FLAGS[@]}" \
            --additional-properties="$PROPS"

      - name: Pubblica in ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.SDK_PUSH_TOKEN }}
          TARGET_REPO: ${{ matrix.repo }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" target
          # Esclude .github: i workflow CI generati non sono pubblicabili con un PAT senza scope 'workflow'.
          rsync -a --delete --exclude='.git' --exclude='.github' generated/ target/
          cd target
          git config user.name "amica-bot"
          git config user.email "bot@gestionaleamica.com"
          git add -A
          git commit -m "Aggiorna SDK da ${GITHUB_REF_NAME}" || echo "Nessuna modifica da committare"
          git push
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git tag "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
