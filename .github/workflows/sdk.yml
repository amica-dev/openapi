name: sdk

# Genera gli SDK pubblici dalla specifica OpenAPI e li pubblica, uno per linguaggio,
# nei rispettivi repository. Si attiva quando arriva un nuovo spec taggato (il tag v* viene
# creato qui dal workflow openapi.yml di Amica20.WebApi.CustomerService) oppure manualmente.
#
# A ogni tag v* aggiorna il codice degli SDK, li tagga e crea una GitHub Release su ciascun
# repo con allegati gli artefatti compilati (.nupkg per C#, wheel/sdist per Python, tarball npm
# per TypeScript, zip sorgente per PHP), così da abilitare l'installazione anche dove il gestore
# di pacchetti non installa direttamente da git (in primis NuGet).
#
# Richiede il secret SDK_PUSH_TOKEN: un PAT con permesso di push E di creazione release sui
# repo amica-dev/<lang>-sdk (scope `repo`).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Verifica che il tag esista su https://hub.docker.com/r/openapitools/openapi-generator-cli/tags
  OPENAPI_GENERATOR_VERSION: v7.11.0

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: csharp
            generator: csharp
            repo: amica-dev/csharp-sdk
            versionProp: packageVersion
            props: "packageName=Amica.Sdk,targetFramework=net8.0,nullableReferenceTypes=true,licenseId=MIT"
          - lang: python
            generator: python
            repo: amica-dev/python-sdk
            versionProp: packageVersion
            props: "packageName=amica_python_sdk,projectName=amica-python-sdk"
          - lang: typescript
            generator: typescript-fetch
            repo: amica-dev/typescript-sdk
            versionProp: npmVersion
            props: "npmName=@amica/typescript-sdk,supportsES6=true,licenseName=MIT"
          - lang: php
            generator: php
            repo: amica-dev/php-sdk
            versionProp: artifactVersion
            props: "invokerPackage=Amica\\Sdk,composerPackageName=amica/php-sdk,licenseName=MIT"
    steps:
      - name: Checkout spec repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pulisci lo spec per gli SDK
        run: python scripts/clean_openapi_for_sdk.py openapi.json openapi-sdk.json

      - name: Genera SDK (${{ matrix.lang }})
        env:
          GENERATOR: ${{ matrix.generator }}
          PROPS: ${{ matrix.props }}
          TARGET_REPO: ${{ matrix.repo }}
          VERSION_PROP: ${{ matrix.versionProp }}
        run: |
          # Versione del pacchetto: derivata dal tag di release (v3.0.0-beta3 -> 3.0.0-beta3);
          # per i dispatch manuali su branch usiamo un placeholder di sviluppo.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          PROPS="${PROPS},${VERSION_PROP}=${VERSION}"
          # gitUserId/gitRepoId vanno passati come flag dedicati (non additional-properties):
          # popolano i repository URL nei metadati dei pacchetti (C#/Python/TypeScript).
          # Per PHP li omettiamo: sovrascriverebbero composerPackageName (amica/php-sdk ->
          # amica-dev/php-sdk) senza in cambio popolare homepage/source.
          GIT_FLAGS=()
          if [ "${{ matrix.lang }}" != "php" ]; then
            GIT_FLAGS=(--git-user-id "${TARGET_REPO%%/*}" --git-repo-id "${TARGET_REPO##*/}")
          fi
          docker run --rm -v "${PWD}:/local" \
            "openapitools/openapi-generator-cli:${OPENAPI_GENERATOR_VERSION}" generate \
            -i /local/openapi-sdk.json \
            -g "$GENERATOR" \
            -t "/local/templates/openapi-generator/${{ matrix.lang }}" \
            -o /local/generated \
            "${GIT_FLAGS[@]}" \
            --additional-properties="$PROPS"
          # openapi-generator gira come root nel container: la dir generata esce root-owned e i
          # successivi step di build (dotnet/npm/python) non potrebbero scriverci. Riallinea l'owner.
          sudo chown -R "$(id -u):$(id -g)" generated

      # Toolchain per la compilazione degli artefatti, una per linguaggio (solo sui tag).
      - name: Setup .NET (csharp)
        if: matrix.lang == 'csharp' && github.ref_type == 'tag'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0'

      - name: Setup Node (typescript)
        if: matrix.lang == 'typescript' && github.ref_type == 'tag'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Costruisci artefatto (${{ matrix.lang }})
        if: github.ref_type == 'tag'
        env:
          LANG_ID: ${{ matrix.lang }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "$LANG_ID" in
            csharp)
              PROJ="$(find generated -name 'Amica.Sdk.csproj' | head -1)"
              dotnet pack "$PROJ" -c Release -o artifacts
              ;;
            python)
              python -m pip install --upgrade build
              python -m build generated --outdir artifacts
              ;;
            typescript)
              ( cd generated && npm install && npm run build --if-present && npm pack --pack-destination ../artifacts )
              ;;
            php)
              ( cd generated && zip -r ../artifacts/amica-php-sdk.zip . -x '.git/*' )
              ;;
          esac
          echo "Artefatti prodotti:" && ls -la artifacts

      - name: Pubblica in ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.SDK_PUSH_TOKEN }}
          TARGET_REPO: ${{ matrix.repo }}
          LANG_ID: ${{ matrix.lang }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" target
          # Esclude .github: i workflow CI generati non sono pubblicabili con un PAT senza scope 'workflow'.
          rsync -a --delete --exclude='.git' --exclude='.github' generated/ target/
          cd target
          git config user.name "amica-bot"
          git config user.email "bot@gestionaleamica.com"
          git add -A
          git commit -m "Aggiorna SDK da ${GITHUB_REF_NAME}" || echo "Nessuna modifica da committare"
          git push
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # -f per essere ri-eseguibile: se il tag/Release esistono già (es. re-build dello
            # stesso tag dopo un fix di pipeline) aggiorna invece di fallire.
            git tag -f "${GITHUB_REF_NAME}"
            git push -f origin "${GITHUB_REF_NAME}"
            # Crea la GitHub Release sul repo SDK con gli artefatti compilati in allegato; se
            # esiste già, ricarica gli artefatti (--clobber) invece di fallire.
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${TARGET_REPO}" \
              --title "${LANG_ID}-sdk ${GITHUB_REF_NAME}" \
              --notes "SDK ${LANG_ID} generato dalla specifica OpenAPI ${GITHUB_REF_NAME}." \
              --latest \
              "${GITHUB_WORKSPACE}"/artifacts/* \
            || gh release upload "${GITHUB_REF_NAME}" \
              --repo "${TARGET_REPO}" \
              --clobber \
              "${GITHUB_WORKSPACE}"/artifacts/*
          fi
